<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía de Auditoría ISO 27001</title>
<meta name="description" content="Guía de auditoría interna ISO/IEC 27001:2022 para Soluciones Globales JM">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--ink:#14202e;--mut:#5a6878;--line:#dde2e8;--brand:#14507a;--brand-ink:#fff;--brand-soft:#e3eef7;
  --ok:#1b7a3d;--ok-bg:#e2f4e8;--obs:#8a5a00;--obs-bg:#fdf1d6;--om:#1f5fa8;--om-bg:#e1ecf9;
  --ncm:#a64b00;--ncm-bg:#ffe6d0;--ncM:#a3122a;--ncM-bg:#fde0e4;--seg:#5b3fa0;--seg-bg:#ece6fa;--na:#5a6878;--na-bg:#eceff3;
  --warn-bg:#fff4d6;--warn-line:#e8c766;--bad-bg:#fde7ea;--bad-line:#e49aa5;
  --r:12px;--sh:0 1px 2px rgba(20,32,46,.06),0 2px 8px rgba(20,32,46,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161d;--card:#18212b;--ink:#e8edf2;--mut:#9aa8b6;--line:#2a3643;--brand:#5aa7de;--brand-ink:#0b1a27;--brand-soft:#1b2c3c;
    --ok:#6fd392;--ok-bg:#183626;--obs:#f0c36a;--obs-bg:#3a2e12;--om:#7db4ee;--om-bg:#172c45;
    --ncm:#ffa862;--ncm-bg:#40250f;--ncM:#ff8a9b;--ncM-bg:#431a22;--seg:#b9a3f2;--seg-bg:#2b2147;--na:#9aa8b6;--na-bg:#222d39;
    --warn-bg:#3a3012;--warn-line:#8a7424;--bad-bg:#3d1b22;--bad-line:#8f3b49;
    --sh:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#10161d;--card:#18212b;--ink:#e8edf2;--mut:#9aa8b6;--line:#2a3643;--brand:#5aa7de;--brand-ink:#0b1a27;--brand-soft:#1b2c3c;
  --ok:#6fd392;--ok-bg:#183626;--obs:#f0c36a;--obs-bg:#3a2e12;--om:#7db4ee;--om-bg:#172c45;
  --ncm:#ffa862;--ncm-bg:#40250f;--ncM:#ff8a9b;--ncM-bg:#431a22;--seg:#b9a3f2;--seg-bg:#2b2147;--na:#9aa8b6;--na-bg:#222d39;
  --warn-bg:#3a3012;--warn-line:#8a7424;--bad-bg:#3d1b22;--bad-line:#8f3b49;--sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:84px}
a{color:var(--brand)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.45rem}h2{font-size:1.15rem}h3{font-size:1rem}
p{margin:0 0 .6em}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.mut{color:var(--mut)}.small{font-size:.86rem}.tiny{font-size:.78rem}
.hide{display:none!important}

/* navegación */
nav.main{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.main a{flex:1;text-align:center;padding:9px 2px 8px;font-size:.72rem;text-decoration:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav.main a .i{font-size:1.25rem;line-height:1}
nav.main a.on{color:var(--brand);font-weight:700}
@media(min-width:760px){
  body{padding-bottom:0;padding-top:56px}
  nav.main{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0 12px;justify-content:center}
  nav.main a{flex:0 0 auto;flex-direction:row;font-size:.92rem;padding:16px 14px;gap:7px}
  nav.main a .i{font-size:1rem}
  nav.main a.on{box-shadow:inset 0 -3px 0 var(--brand)}
}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 12px;box-shadow:var(--sh)}
.card.hero{background:var(--brand);color:var(--brand-ink);border:0}
.card.hero a{color:inherit}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.card.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.card.soft{background:var(--brand-soft);border-color:transparent}
.grid{display:grid;gap:12px}
@media(min-width:760px){.grid.c2{grid-template-columns:1fr 1fr}.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}}
.kpi{text-align:center;padding:10px}
.kpi b{display:block;font-size:1.7rem;line-height:1.1}
.kpi span{font-size:.8rem;color:var(--mut)}

/* botones */
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;min-height:42px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover,.btn:hover{border-color:var(--brand)}
button.primary,.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
button.danger{color:var(--ncM);border-color:var(--bad-line)}
button.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* chips */
.chip,.ref{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:0;line-height:1.5;margin:0 4px 4px 0}
button.ref{cursor:pointer;color:var(--brand);border-color:var(--brand-soft);background:var(--brand-soft);font-weight:600}
.badge{display:inline-block;border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:700;margin-right:4px}
.t-pend{background:var(--na-bg);color:var(--na)}.t-ok{background:var(--ok-bg);color:var(--ok)}.t-obs{background:var(--obs-bg);color:var(--obs)}
.t-om{background:var(--om-bg);color:var(--om)}.t-ncm{background:var(--ncm-bg);color:var(--ncm)}.t-ncM{background:var(--ncM-bg);color:var(--ncM)}
.t-seg{background:var(--seg-bg);color:var(--seg)}.t-na{background:var(--na-bg);color:var(--na)}
.b-sug{background:var(--warn-bg);color:var(--obs);border:1px solid var(--warn-line)}
.b-tec{background:var(--seg-bg);color:var(--seg)}
.b-hoy{background:var(--ncM-bg);color:var(--ncM)}

/* progreso */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok i{background:var(--ok)}

/* pestañas internas */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;overflow-x:auto}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;white-space:nowrap;color:var(--mut)}
.tabs button.on{border-bottom-color:var(--brand);color:var(--brand);font-weight:700}

/* sesiones */
.day{margin:20px 0 8px;font-size:1rem;color:var(--mut);display:flex;align-items:center;gap:8px}
.ses{display:block;color:inherit;text-decoration:none}
.ses:hover{border-color:var(--brand)}
.ses h3{margin:2px 0 4px}
.ses .meta{font-size:.84rem;color:var(--mut)}
.ses.done{opacity:.72}
.ses.next{border:2px solid var(--brand)}

/* preguntas */
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 10px}
.q.s-conforme{border-left-color:var(--ok)}.q.s-obs{border-left-color:var(--obs)}.q.s-om{border-left-color:var(--om)}
.q.s-ncmenor{border-left-color:var(--ncm)}.q.s-ncmayor{border-left-color:var(--ncM)}.q.s-seguimiento{border-left-color:var(--seg)}
.q-text{font-size:1.04rem;font-weight:600;margin:4px 0 6px}
.q-ev{font-size:.9rem;margin:0 0 4px}
.q details{margin:4px 0}
.q summary{cursor:pointer;color:var(--mut);font-size:.88rem;padding:4px 0}
.q-al p{background:var(--bad-bg);border:1px solid var(--bad-line);border-radius:8px;padding:8px 10px;font-size:.9rem}
.stbtns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stbtns button{min-height:38px;padding:6px 11px;font-size:.84rem;border-radius:8px}
.stbtns button[aria-pressed="true"]{font-weight:700;border-width:2px}
.stbtns button.t-ok[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.stbtns button.t-obs[aria-pressed="true"]{background:var(--obs-bg);color:var(--obs);border-color:var(--obs)}
.stbtns button.t-om[aria-pressed="true"]{background:var(--om-bg);color:var(--om);border-color:var(--om)}
.stbtns button.t-ncm[aria-pressed="true"]{background:var(--ncm-bg);color:var(--ncm);border-color:var(--ncm)}
.stbtns button.t-ncM[aria-pressed="true"]{background:var(--ncM-bg);color:var(--ncM);border-color:var(--ncM)}
.stbtns button.t-seg[aria-pressed="true"]{background:var(--seg-bg);color:var(--seg);border-color:var(--seg)}
.stbtns button.t-na[aria-pressed="true"]{background:var(--na-bg);color:var(--na);border-color:var(--na)}
textarea,input[type=text],input[type=search],select,input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin:0 0 8px}
textarea{min-height:80px;resize:vertical}
label{display:block;font-weight:600;font-size:.9rem;margin:6px 0 3px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-weight:400;font-size:.95rem;margin:0}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;margin-top:2px;flex:none}
.chk span{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.filters button{border-radius:99px;min-height:34px;padding:4px 12px;font-size:.85rem}
.filters button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* tablas */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mut)}
.tbl{overflow-x:auto}
tr.mine td:first-child{box-shadow:inset 4px 0 var(--brand)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
@media(min-width:760px){.modal{align-items:center}.modal>div{border-radius:16px}}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:.9rem;max-width:90vw}
.preview{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.92rem}
.qa li{margin:3px 0}
details.card summary{cursor:pointer;font-weight:600}

@media print{
  nav.main,.noprint,button,.filters,.tabs{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:11pt}
  .card,.q{box-shadow:none;break-inside:avoid;border-color:#bbb}
}

</style>
</head>
<body>
<div id="aviso-storage" class="wrap hide"><div class="card bad"><b>Este navegador no permite guardar datos.</b> Lo que escriba se perderá al cerrar. Use «Datos → Descargar respaldo» con frecuencia o abra el archivo en otro navegador.</div></div>
<main id="app" aria-live="polite"></main>
<nav class="main" aria-label="Navegación principal">
<a href="#/plan" data-v="plan"><span class="i">📋</span>Plan</a>
<a href="#/hallazgos" data-v="hallazgos"><span class="i">🚩</span>Hallazgos</a>
<a href="#/cobertura" data-v="cobertura"><span class="i">📊</span>Cobertura</a>
<a href="#/cronograma" data-v="cronograma"><span class="i">🗓</span>Cronograma</a>
<a href="#/biblioteca" data-v="biblioteca"><span class="i">📖</span>Biblioteca</a>
<a href="#/datos" data-v="datos"><span class="i">💾</span>Datos</a>
</nav>
<script>
/* ===== DATOS DE LA NORMA ISO/IEC 27001:2022 ===== */
/* Formato cláusulas: [id, título, "en simple", "evidencia típica"] */
const CLAUSULAS = [
['4.1','Comprensión de la organización y de su contexto','La empresa identifica qué factores internos y externos (legales, tecnológicos, de mercado, contractuales) afectan su capacidad de proteger la información.','Análisis de contexto con fecha y evidencia de revisión periódica.'],
['4.2','Necesidades y expectativas de las partes interesadas','Quiénes tienen interés en la seguridad (clientes, reguladores, empleados, proveedores) y cuáles de sus requisitos debe cumplir la empresa. Desde 2022 debe decir cuáles se abordan con el SGSI.','Matriz de partes interesadas con requisitos concretos.'],
['4.3','Alcance del SGSI','Define qué procesos, ubicaciones, sistemas y activos protege el SGSI, y qué queda fuera y por qué.','Declaración de alcance aprobada, con interfaces y dependencias.'],
['4.4','Sistema de gestión de seguridad de la información','Establecer, mantener y mejorar el SGSI y sus procesos.','Mapa de procesos y documentación del SGSI.'],
['5.1','Liderazgo y compromiso','La alta dirección se involucra de verdad: asigna recursos, integra la seguridad en los procesos y promueve la mejora.','Actas, presupuesto de seguridad, comunicados de la dirección.'],
['5.2','Política de seguridad de la información','Política apropiada al negocio, con objetivos (o marco para fijarlos), compromiso de cumplir requisitos y de mejorar; disponible y comunicada.','Política aprobada, fecha, evidencia de difusión.'],
['5.3','Roles, responsabilidades y autoridades','Quién es responsable de qué y quién informa a la dirección sobre el desempeño del SGSI.','Organigrama, descripciones de puesto, designaciones.'],
['6.1.1','Acciones para abordar riesgos y oportunidades (generalidades)','Con base en el contexto (4.1) y las partes interesadas (4.2) se determinan los riesgos y oportunidades a tratar.','Vínculo documentado entre contexto, partes interesadas y riesgos.'],
['6.1.2','Evaluación de riesgos de seguridad de la información','Método definido (criterios de aceptación, probabilidad, impacto) que produce resultados comparables y reproducibles; identifica riesgos y sus dueños.','Metodología, matriz de riesgos, criterios, propietarios de riesgo.'],
['6.1.3','Tratamiento de riesgos y Declaración de Aplicabilidad (SoA)','Elegir controles para tratar los riesgos, compararlos con el Anexo A, producir el SoA (incluidos/excluidos con justificación y estado) y obtener aprobación de los riesgos residuales.','Plan de tratamiento, SoA vigente (numeración 2022), aprobaciones.'],
['6.2','Objetivos de seguridad de la información','Objetivos medibles, con responsable, plazo, recursos y forma de evaluación; coherentes con la política y monitoreados.','Objetivos con indicadores y resultados recientes.'],
['6.3','Planificación de cambios (nuevo 2022)','Si se cambia el SGSI, el cambio se planifica de forma controlada.','Registro de cambios con evaluación de impacto.'],
['7.1','Recursos','La empresa determina y provee los recursos (personas, tecnología, presupuesto) que el SGSI necesita.','Presupuesto, dotación de personal, herramientas.'],
['7.2','Competencia','Las personas que afectan la seguridad son competentes (formación, experiencia) y hay evidencia.','Perfiles de puesto, certificaciones, evaluaciones.'],
['7.3','Concienciación','El personal conoce la política, su contribución al SGSI y las consecuencias de no cumplir.','Entrevistas al azar, registros de inducción y campañas.'],
['7.4','Comunicación','Qué se comunica, cuándo, a quién y cómo (interna y externamente) sobre seguridad.','Plan de comunicación y evidencias.'],
['7.5','Información documentada','Documentos y registros requeridos por la norma y necesarios para el SGSI: identificados, aprobados, controlados, disponibles y protegidos (7.5.1 a 7.5.3).','Listado maestro, control de versiones, accesos.'],
['8.1','Planificación y control operacional','Los procesos necesarios para cumplir requisitos y ejecutar los planes de riesgos están planificados, controlados y los cambios gestionados; los procesos externalizados controlados.','Procedimientos operativos, control de cambios, control de proveedores.'],
['8.2','Evaluación de riesgos (ejecución)','Los riesgos se reevalúan a intervalos planificados o cuando hay cambios significativos, y se conservan los resultados.','Evaluaciones recientes con fecha y registros.'],
['8.3','Tratamiento de riesgos (ejecución)','El plan de tratamiento se implementa de verdad y se conservan resultados.','Avance del plan, evidencias de controles implementados.'],
['9.1','Seguimiento, medición, análisis y evaluación','Qué se mide del SGSI, cuándo, quién, y cómo se analiza; se evalúa desempeño y eficacia.','Indicadores, tableros, análisis.'],
['9.2','Auditoría interna','Programa de auditorías, criterios, alcance, auditores objetivos e imparciales, resultados informados a la gerencia.','Programa, informes, competencia de auditores.'],
['9.3','Revisión por la dirección','La dirección revisa el SGSI a intervalos planificados con entradas definidas (9.3.2) y toma decisiones documentadas (9.3.3).','Acta con entradas, decisiones, responsables y plazos.'],
['10.1','Mejora continua','El SGSI mejora de forma continua en conveniencia, adecuación y eficacia.','Evidencia de mejoras implementadas.'],
['10.2','No conformidades y acciones correctivas','Reaccionar, corregir, analizar causa, implementar acciones, verificar su eficacia y registrar.','Registro de NC, análisis de causa, verificación de eficacia.']
];

const TEMAS = {5:'Organizacionales (A.5)',6:'Personas (A.6)',7:'Físicos (A.7)',8:'Tecnológicos (A.8)'};

/* Formato controles: [id, título, "en simple", "evidencia típica"] */
const CONTROLES = [
['A.5.1','Políticas de seguridad de la información','Reglas escritas y aprobadas por la dirección sobre cómo se protege la información.','Política general y específicas, aprobadas, con fecha de revisión y difusión.'],
['A.5.2','Roles y responsabilidades de seguridad','Quién responde por qué en seguridad de la información.','Organigrama, descripciones de puesto, designación del responsable de seguridad.'],
['A.5.3','Segregación de funciones','Tareas que no deben concentrarse en una sola persona para evitar fraude o errores.','Matriz de segregación; ejemplo: quien desarrolla no despliega solo.'],
['A.5.4','Responsabilidades de la dirección','La dirección exige que todos cumplan las reglas de seguridad.','Actas, comunicados, seguimiento del cumplimiento.'],
['A.5.5','Contacto con las autoridades','Saber a quién llamar (reguladores, policía, CSIRT) ante un incidente.','Lista de contactos vigente y procedimiento.'],
['A.5.6','Contacto con grupos de interés especial','Estar conectado con foros o grupos de seguridad para mantenerse al día.','Membresías, boletines, participación.'],
['A.5.7','Inteligencia de amenazas','Recoger y analizar información sobre amenazas actuales.','Fuentes, boletines revisados, acciones derivadas.'],
['A.5.8','Seguridad de la información en la gestión de proyectos','Considerar la seguridad desde el inicio de cada proyecto.','Plantilla de proyecto con análisis de riesgos de seguridad.'],
['A.5.9','Inventario de información y otros activos','Lista de qué hay que proteger y quién es el dueño de cada cosa.','Inventario actualizado con propietarios.'],
['A.5.10','Uso aceptable de la información y activos','Reglas de qué se puede y qué no hacer con la información y los equipos.','Política de uso aceptable aceptada por el personal.'],
['A.5.11','Devolución de activos','Quien sale o cambia de puesto devuelve equipos e información.','Acta de devolución o checklist de salida.'],
['A.5.12','Clasificación de la información','Categorizar la información por sensibilidad (pública, interna, confidencial).','Política de clasificación y ejemplos aplicados.'],
['A.5.13','Etiquetado de la información','Marcar la información según su clasificación.','Documentos etiquetados; procedimiento.'],
['A.5.14','Transferencia de información','Reglas para enviar información por correo, mensajería, USB o en papel.','Política de transferencia, acuerdos, muestra de envíos reales.'],
['A.5.15','Control de acceso','Reglas de quién puede acceder a qué, según la necesidad del negocio.','Política de control de acceso y matriz de roles.'],
['A.5.16','Gestión de identidad','Cada persona o sistema tiene una identidad única y controlada.','Procedimiento de altas y bajas; sin cuentas genéricas.'],
['A.5.17','Información de autenticación','Gestión segura de contraseñas y otros métodos para iniciar sesión.','Política de contraseñas, MFA, gestor de contraseñas.'],
['A.5.18','Derechos de acceso','Otorgar, revisar y retirar accesos de forma controlada.','Solicitudes aprobadas, revisión periódica, bajas oportunas.'],
['A.5.19','Seguridad en las relaciones con proveedores','Gestionar los riesgos de seguridad al contratar proveedores.','Política de proveedores, evaluación de riesgos del proveedor.'],
['A.5.20','Seguridad en los acuerdos con proveedores','Poner requisitos de seguridad en los contratos.','Contratos con cláusulas de seguridad y confidencialidad.'],

  {ref:['5.3','A.5.2'],q:'¿Quién es el responsable del SGSI y a quién reporta? ¿Dónde está formalizado?',ev:'Designación escrita, descripción del puesto, organigrama.',al:'El responsable no tiene autoridad ni tiempo asignado; conflicto de interés (opera y audita lo mismo).'},
  {ref:['A.5.3'],q:'¿Hay funciones que, por riesgo, no deben estar en una misma persona (quien aprueba accesos y quien los usa, quien desarrolla y quien despliega)? ¿Cómo lo controlan?',ev:'Matriz de segregación de funciones o regla documentada.',al:'Una sola persona controla un proceso crítico de principio a fin.'},
  {ref:['7.5'],q:'¿Qué información documentada exige la norma y cuál definieron como necesaria? Muéstreme el listado maestro.',ev:'Listado maestro con código, versión, fecha, responsable.',al:'Faltan documentos obligatorios: alcance, política, metodología de riesgos, SoA, objetivos, resultados de auditoría, revisión por la dirección.'},
  {ref:['7.5'],q:'Elijamos 3 documentos (política, procedimiento, registro): ¿están identificados (código, versión, autor, aprobador)? ¿Cómo se controla quién puede modificarlos?',ev:'Documentos reales con control de versiones y permisos de edición.',al:'Varias versiones circulando; permisos de edición abiertos a todos; documentos en carpetas personales o correo.'},
  {ref:['A.5.35'],q:'¿Cómo se hace la revisión independiente de la seguridad de la información (auditoría interna/externa, pruebas)? ¿Con qué frecuencia y quién es independiente de lo revisado?',ev:'Programa de auditoría, informes de revisión independiente, informe de pentest si aplica.',al:'La revisión la hace quien opera los controles; no hay planificación.'},
  {ref:['A.5.36'],q:'¿Cómo comprueba la gerencia que se cumplen las políticas y normas de seguridad? ¿Cómo se gestionan las excepciones?',ev:'Informes de cumplimiento por gerencia, registro de excepciones aprobadas.',al:'Excepciones informales sin aprobación ni plazo.'},
  {ref:['A.5.1'],sug:true,q:'Además de la política general, ¿qué políticas específicas existen (control de acceso, respaldo, uso aceptable, criptografía, clasificación)? ¿Quién las aprueba?',ev:'Listado de políticas específicas con aprobación de la dirección.',al:'Pocas políticas específicas o sin aprobación formal.'},
  {ref:['A.5.4'],sug:true,q:'¿Cómo exige la dirección que el personal aplique las reglas de seguridad?',ev:'Comunicados, evaluación de desempeño que incluye seguridad.',al:''}
 ]},

ventas:{
 objetivo:'Verificar que la información de clientes y prospectos se maneja con seguridad durante la venta, que los requisitos de seguridad de los clientes se identifican antes de comprometerse y que los datos personales se tratan de forma lícita.',
 simple:'A.5.14 (cómo se envía información a terceros) y A.5.34 (datos personales). El riesgo típico: propuestas con datos del cliente enviadas por WhatsApp o correo personal, CRM abierto a todos y promesas de seguridad que operaciones no puede cumplir.',
 prep:['Política de transferencia de información','Muestra de 3 propuestas o contratos recientes','Acuerdos de confidencialidad (NDA) con clientes','Registro de bases de datos / tratamiento de datos personales','Lista de usuarios del CRM y nómina actual de vendedores'],
 preguntas:[
  {ref:['A.5.14'],q:'Cuando envía una propuesta, cotización o contrato a un cliente, ¿por qué medio lo hace? ¿Existe una regla sobre canales permitidos (correo corporativo, WhatsApp, Drive personal)?',ev:'Política de transferencia; 3 envíos recientes con el canal usado.',al:'Uso de WhatsApp o correo personal para documentos con datos de clientes; sin regla.'},
  {ref:['A.5.14','A.6.6'],q:'¿Cómo protege la información sensible al compartirla (contraseña, cifrado, enlace con vencimiento)? ¿Hay NDA firmado con clientes y prospectos?',ev:'Muestra de NDAs firmados; plantilla estándar.',al:'Se comparte información sensible antes de firmar NDA.'},
  {ref:['A.5.34'],q:'¿Qué datos personales de clientes y prospectos recopilan (nombre, documento de identidad, correo, teléfono)? ¿Dónde se guardan y quién accede?',ev:'Registro de tratamiento de datos o inventario de datos personales; política de privacidad.',al:'Datos en hojas de Excel locales; CRM abierto a todos.'},
  {ref:['A.5.34','A.5.31'],q:'¿Cómo obtienen y registran el consentimiento? ¿Cómo atienden solicitudes de acceso, rectificación o supresión de datos? (Confirme con el Asesor Legal qué ley de protección de datos aplica en el país de operación.)',ev:'Formato de consentimiento y registro de solicitudes atendidas.',al:'No hay procedimiento; nadie sabe quién atiende estas solicitudes.'},
  {ref:['4.2','A.5.31'],q:'¿Cómo identifican los requisitos de seguridad que el cliente exige (confidencialidad, SLA, auditorías, certificaciones) antes de firmar? ¿Quién los revisa?',ev:'Revisión de contratos de 3 clientes; checklist de revisión previa; matriz de requisitos de clientes.',al:'Ventas promete cosas sin revisión técnica ni legal; las cláusulas de seguridad no llegan a Operaciones.'},
  {ref:['A.5.18','A.8.3'],sug:true,q:'¿Quién tiene acceso al CRM? ¿Qué pasa con el acceso de un vendedor que se va de la empresa?',ev:'Lista de usuarios del CRM comparada con la nómina actual (3 salidas recientes).',al:'Usuarios de ex-empleados activos; cuentas compartidas.'},
  {ref:['A.5.12','A.5.13'],sug:true,q:'¿Cómo sabe si un documento es confidencial? ¿Está clasificado o etiquetado?',ev:'Política de clasificación; 3 documentos de muestra.',al:'El personal no distingue información interna de confidencial.'},
  {ref:['A.7.7'],sug:true,q:'Observación en sitio: pantallas desbloqueadas, documentos con datos de clientes sobre escritorios, impresiones olvidadas.',ev:'Anote cantidad de puestos observados y cuántos incumplen.',al:''},
  {ref:['A.6.7'],sug:true,q:'¿Los vendedores trabajan fuera de la oficina? ¿Con qué equipos y qué protección (VPN, cifrado)?',ev:'Política de trabajo remoto; equipos usados.',al:'Uso de equipos personales sin ninguna regla.'}
 ]},

marcas:{
 objetivo:'Verificar el uso lícito y seguro de datos en mercadeo, el control de cuentas de redes sociales y proveedores externos, y que lo que se afirma a los clientes sobre seguridad sea veraz.',
 simple:'Mismo A.5.14 y A.5.34 que Ventas, pero aplicados a campañas, redes sociales, agencias y respuestas a cuestionarios de seguridad (preventa).',
 prep:['Bases de datos de contactos y política de privacidad','Contratos con agencias de mercadeo','Lista de quién administra redes sociales y web','Cuestionarios de seguridad de clientes respondidos recientemente','Material comercial que menciona ISO / certificaciones'],
 preguntas:[
  {ref:['A.5.34'],q:'¿De dónde provienen las bases de datos de correos y teléfonos usadas en campañas? ¿Cómo se obtuvo el consentimiento y cómo puede una persona darse de baja?',ev:'Origen de las listas, mecanismo de baja, muestra de consentimientos.',al:'Listas compradas o heredadas sin consentimiento; sin opción de baja.'},
  {ref:['A.5.14','A.5.12'],q:'¿Se publican casos de éxito, logos o información de clientes? ¿Quién autoriza y cómo?',ev:'Autorización escrita del cliente (muestra de 2 casos publicados).',al:'Publicación de logos o resultados sin permiso, violando NDA.'},
  {ref:['A.5.17','A.8.5'],q:'¿Quién tiene acceso a las cuentas de redes sociales, web y herramientas de campañas? ¿Se usan contraseñas compartidas? ¿Hay doble factor? ¿Qué pasa cuando alguien sale?',ev:'Lista de administradores de cada cuenta comparada con el equipo actual.',al:'Contraseña única compartida; ex-empleados o agencia anterior con acceso.'},
  {ref:['A.5.19','A.5.20'],q:'¿Qué agencias o proveedores externos tienen acceso a información de la empresa o de clientes? ¿Hay contrato con cláusulas de confidencialidad?',ev:'Contratos y NDAs con agencias; evaluación del proveedor.',al:'Agencia con acceso a datos de clientes sin contrato de confidencialidad.'},
  {ref:['4.2','A.5.31'],q:'(Preventa) Cuando un cliente envía un cuestionario o licitación con requisitos de seguridad, ¿quién responde y cómo verifica que lo que afirma es cierto?',ev:'2 cuestionarios respondidos y la evidencia que respalda cada respuesta.',al:'Se afirma tener controles o certificaciones que no existen o que están fuera del alcance.'},
  {ref:['7.4'],q:'¿Qué se dice públicamente sobre ISO 27001 u otras certificaciones? ¿Quién valida que sea exacto respecto al alcance real?',ev:'Material comercial, web, firmas de correo.',al:'Publicidad que afirma «certificados» cuando solo hay auditoría interna, o el alcance difiere.'},
  {ref:['A.5.5','A.5.14'],sug:true,q:'Si hubiera un incidente que afecte a clientes, ¿quién comunica a los clientes y a los medios? ¿Está definido?',ev:'Procedimiento de comunicación de crisis.',al:'Sin portavoz definido.'}
 ]},

tecnologia:{
 objetivo:'Comprobar que los controles técnicos centrales (malware, vulnerabilidades, respaldos, redes y cifrado) existen, funcionan y se mantienen, y que los recursos son suficientes.',
 simple:'Día técnico por excelencia. Usted no necesita saber cómo se configura un firewall. Necesita ver que existe, que alguien lo revisa, que se puede demostrar y que coincide con los riesgos y la SoA. Pida que le MUESTREN en pantalla.',
 prep:['Inventario de activos de TI','Políticas: respaldo, criptografía, control de acceso, malware','Último informe de escaneo de vulnerabilidades y de pentest','Diagrama de red','Reportes de respaldo de los últimos 30 días y última prueba de restauración','Lista de administradores y de empleados que salieron en los últimos 6 meses (solicitar a RRHH)'],
 preguntas:[
  {ref:['7.1'],q:'¿Cuenta el área con presupuesto, personal y herramientas suficientes para mantener el SGSI? ¿Cómo lo determinan?',ev:'Presupuesto de seguridad, estructura del área, herramientas licenciadas.',al:'Una sola persona sostiene toda la seguridad; herramientas con licencia vencida.'},
  {ref:['A.8.7'],q:'¿Qué protección contra malware (antivirus/EDR) tienen y en qué porcentaje de equipos y servidores está instalada y actualizada? ¿Cómo lo saben?',ev:'Pida ver la consola EN VIVO: equipos totales, protegidos y con definiciones actualizadas. Compare con el inventario.',al:'Equipos sin agente; firmas desactualizadas; la cobertura no se mide.'},
  {ref:['A.8.8'],q:'¿Cada cuánto escanean vulnerabilidades? ¿Cómo las priorizan y en cuánto tiempo corrigen las críticas? ¿Hacen pruebas de penetración?',ev:'Último informe de escaneo, listado de críticas/altas y estado, plazo de parcheo, informe de pentest y plan de remediación.',al:'Críticas abiertas fuera de plazo; software sin soporte del fabricante; sin escaneo al menos trimestral.'},
  {ref:['A.8.8','A.8.19'],q:'¿Cómo gestionan las actualizaciones de sistemas operativos y aplicaciones? ¿Cuántos equipos están atrasados hoy?',ev:'Reporte de parches pendientes, ventanas de mantenimiento recientes.',al:'Parches aplicados «cuando se puede», sin registro.'},
  {ref:['A.8.13'],q:'¿Qué se respalda, con qué frecuencia, dónde se guarda y por cuánto tiempo? ¿Cuándo fue la última prueba de restauración y qué resultado tuvo? Muéstremela.',ev:'Política de respaldo, reportes de ejecución (fallos y reintentos), acta de prueba de restauración, copia fuera del sitio, cifrado.',al:'Respaldos fallidos sin seguimiento; sin prueba de restauración; copia en el mismo servidor; respaldo accesible a ransomware.'},
  {ref:['A.8.20'],q:'¿Cómo protegen la red (firewall, VPN, WiFi de invitados)? ¿Quién revisa las reglas del firewall y con qué frecuencia?',ev:'Diagrama de red, acta de revisión de reglas, configuración de WiFi de invitados.',al:'Reglas abiertas «any-any»; sin diagrama; WiFi de invitados conectado a la red interna; servicios expuestos a Internet sin justificación.'},
  {ref:['A.8.22'],sug:true,q:'¿Están separadas las redes de usuarios, servidores e invitados?',ev:'Diagrama de segmentación.',al:'Red plana donde todo ve a todo.'},
  {ref:['A.8.24'],q:'¿Dónde usan cifrado (discos de laptops, respaldos, comunicaciones web, base de datos)? ¿Hay política de criptografía? ¿Cómo gestionan llaves y certificados?',ev:'Política, inventario de certificados con vencimientos, evidencia de laptops cifradas.',al:'Laptops sin cifrar; certificados vencidos; claves guardadas junto a los datos.'},
  {ref:['A.5.15','A.5.16','A.5.18','A.8.2','A.8.5'],sug:true,q:'¿Cómo se otorgan, modifican y retiran accesos? Muéstreme la lista de administradores y cuándo se revisó. ¿Se usa doble factor (MFA)? ¿En qué sistemas?',ev:'Procedimiento de altas y bajas; lista de administradores; revisión periódica; prueba: ex-empleados de los últimos 6 meses con cuentas activas.',al:'Cuentas activas de personas que ya salieron; cuenta «admin» compartida; sin MFA en correo, VPN y administración.'},
  {ref:['A.8.1'],sug:true,q:'¿Qué reglas aplican a laptops y celulares de trabajo (cifrado, bloqueo, borrado remoto, uso de equipos personales)?',ev:'Política de dispositivos; configuración de una muestra de 3 equipos.',al:'Equipos personales con acceso a correo corporativo sin ningún control.'},
  {ref:['A.8.15','A.8.17'],sug:true,q:'¿Qué eventos se registran (accesos, cambios de privilegios, acciones administrativas), por cuánto tiempo y quién puede borrarlos?',ev:'Configuración de registros y retención; protección contra modificación.',al:'Los administradores pueden borrar sus propios registros.'},
  {ref:['A.8.9'],sug:true,q:'¿Existen configuraciones base seguras para servidores y equipos? ¿Cómo detectan cambios no autorizados?',ev:'Documento de línea base; ejemplo de desviación detectada.',al:''},
  {ref:['A.8.12','A.8.23'],sug:true,q:'¿Cómo evitan que información sensible salga de la empresa (USB, correo, nube personal) y cómo filtran sitios web peligrosos?',ev:'Reglas configuradas y reportes.',al:'Puertos USB abiertos y sin control.'},
  {ref:['A.7.1','A.7.2','A.7.4','A.7.5','A.7.8','A.7.11','A.7.12','A.7.13'],sug:true,q:'RECORRIDO FÍSICO (cuarto de servidores / comunicaciones): control de acceso y bitácora de visitas, detección de incendio y extintores, climatización, UPS o planta eléctrica, cámaras, orden del cableado.',ev:'Fotografíe o describa lo observado. Pida la bitácora de acceso del último mes y los registros de mantenimiento.',al:'Puerta abierta o sin control; el cuarto se usa como almacén; sin extintor o con fecha vencida; sin respaldo eléctrico probado.'},
  {ref:['A.7.14','A.7.10'],sug:true,q:'¿Cómo se destruyen o reutilizan equipos y discos al final de su vida útil?',ev:'Certificados de borrado o destrucción.',al:'Equipos dados de baja sin borrado verificado.'}
 ]},

desarrollo:{
 objetivo:'Verificar que el software se desarrolla con seguridad desde los requisitos hasta la liberación: ambientes separados, código revisado, pruebas, control de cambios y acceso controlado al código.',
 simple:'La mejor técnica para quien no programa es seguir UN cambio real de punta a punta: «Elijamos las dos últimas funcionalidades liberadas. Muéstreme el requerimiento, el código, la revisión, las pruebas, la aprobación y la liberación». La trazabilidad se audita sin entender el código.',
 prep:['Procedimiento de ciclo de vida de desarrollo','Lista de proyectos/liberaciones del último trimestre (usted elegirá 2-3)','Diagrama de entornos (desarrollo, pruebas, producción)','Lista de miembros del repositorio de código','Contratos con proveedores de desarrollo externo (si hay)'],
 preguntas:[
  {ref:['A.8.25'],q:'Explíqueme cómo se desarrolla un software desde la solicitud hasta producción. ¿Existe un procedimiento de ciclo de vida de desarrollo seguro?',ev:'Procedimiento; una liberación reciente rastreada completa: solicitud → código → pruebas → aprobación → despliegue.',al:'El proceso real difiere del documentado; un solo desarrollador hace todo; no hay evidencia del flujo.'},
  {ref:['A.8.26'],q:'¿Cómo identifican los requisitos de seguridad de una aplicación (autenticación, protección de datos, registros, cumplimiento)? Muéstreme los de un proyecto reciente.',ev:'Requisitos de seguridad dentro de la historia de usuario o especificación; análisis de riesgos del proyecto.',al:'Los requisitos de seguridad no aparecen en ningún documento de proyecto.'},
  {ref:['A.8.28'],q:'¿Existen estándares de codificación segura? ¿Hacen revisión de código entre pares antes de integrar? ¿Cómo gestionan librerías de terceros?',ev:'Guía de codificación; pull requests recientes con revisor distinto al autor; reporte de análisis de código o de dependencias.',al:'El mismo desarrollador aprueba y despliega; contraseñas o llaves escritas dentro del código; librerías desactualizadas con vulnerabilidades conocidas.'},
  {ref:['A.8.8'],q:'¿Cómo se enteran de vulnerabilidades en las librerías que usan y cómo las corrigen?',ev:'Reporte de escaneo de dependencias y tiempos de corrección.',al:'Sin ninguna herramienta ni proceso.'},
  {ref:['A.8.29'],q:'¿Qué pruebas se hacen antes de liberar (funcionales, de seguridad, aceptación del usuario)? ¿Quién aprueba la salida a producción? Muéstreme las dos últimas liberaciones.',ev:'Plan y resultados de pruebas; acta de aceptación; resultados de escaneos o pentest.',al:'Se prueba directamente en producción; sin criterios de aceptación; vulnerabilidades críticas abiertas al liberar.'},
  {ref:['A.8.31'],q:'¿Existen entornos separados de desarrollo, pruebas y producción? ¿Quién accede a cada uno? ¿Los desarrolladores pueden modificar producción directamente?',ev:'Diagrama de entornos; lista de accesos por entorno.',al:'Mismo servidor o base de datos para pruebas y producción; desarrolladores con administración de producción.'},
  {ref:['A.8.33','A.8.11','A.5.34'],sug:true,q:'¿Qué datos se usan en las pruebas? ¿Se usan datos reales de clientes? ¿Se enmascaran?',ev:'Muestra de la base de datos de pruebas.',al:'Copia de la base de producción con datos reales en el entorno de pruebas.'},
  {ref:['A.8.32'],sug:true,q:'¿Cómo controlan los cambios a los sistemas? ¿Quién autoriza, cómo planifican el despliegue y la reversión (rollback)? Muéstreme 3 cambios del último trimestre.',ev:'Expedientes de cambio con aprobación y plan de reversión.',al:'Cambios urgentes sin registro posterior; el solicitante se aprueba a sí mismo.'},
  {ref:['A.8.4'],sug:true,q:'¿Quién tiene acceso al código fuente? ¿Dónde está alojado y se exige doble factor? ¿Qué pasa cuando alguien deja la empresa?',ev:'Pida ver la lista de miembros del repositorio y compárela con la nómina; revise si hay ramas protegidas.',al:'Ex-empleados o cuentas genéricas con acceso; acceso total para todos.'},
  {ref:['A.8.27'],sug:true,q:'¿Aplican principios de arquitectura segura (mínimo privilegio, defensa en profundidad)? ¿Quién los revisa?',ev:'Documento de arquitectura y su revisión.',al:''},
  {ref:['A.8.30','A.5.21'],sug:true,q:'¿Hay desarrollo subcontratado? ¿Cómo exigen seguridad al proveedor y cómo revisan lo que entrega?',ev:'Contrato con requisitos de seguridad; revisión de entregables.',al:'El proveedor trabaja directamente sobre producción sin supervisión.'}
 ]},

servicios_ti:{
 objetivo:'Comprobar que los servicios y productos TI se operan con seguridad: continuidad, monitoreo, gestión de incidentes, cambios, capacidad e inventario de activos.',
 simple:'Aquí hay dos temas que el cronograma NO asigna a nadie y que son de los más importantes: gestión de incidentes (A.5.24-A.5.28) y gestión de cambios/activos. Se los agregué como «sugeridos». El orden recomendado: continuidad → incidentes → monitoreo → cambios.',
 prep:['Catálogo de servicios y SLA ofrecidos a clientes','Plan de continuidad (BCP/DRP) y análisis de impacto (BIA)','Informe de la última prueba de recuperación','Registro de incidentes de los últimos 12 meses','Inventario de activos','Contratos con proveedores críticos (nube, hosting, conectividad)'],
 preguntas:[
  {ref:['8.1'],q:'¿Qué servicios y productos TI ofrece la organización? ¿Cuáles son los más críticos y cuáles están dentro del alcance del SGSI?',ev:'Catálogo de servicios y su relación con el alcance.',al:'Servicios críticos fuera del alcance.'},
  {ref:['A.5.29'],q:'¿Cómo mantienen la seguridad durante una interrupción (falla grave, ciberataque, desastre)? ¿Qué controles se mantienen o se relajan en contingencia?',ev:'Plan de continuidad con requisitos de seguridad, BIA.',al:'El plan ignora la seguridad (ej.: en emergencia se comparten contraseñas); nunca se probó.'},
  {ref:['A.5.30'],q:'¿Cuáles son los RTO y RPO de los sistemas críticos? ¿Cuándo fue la última prueba de recuperación? ¿Qué resultado tuvo y qué corrigieron?',ev:'Informe de prueba con fecha, participantes, resultados y acciones. (RTO = tiempo máximo para volver a operar; RPO = máxima pérdida de datos tolerable.)',al:'Prueba de más de 12 meses o inexistente; el RTO declarado no se alcanzó en la prueba y no se actuó.'},
  {ref:['A.5.24','A.5.25','A.5.26','A.5.27'],sug:true,q:'Cuénteme del último incidente de seguridad: cómo se detectó, quién lo evaluó, cómo lo clasificó, qué se hizo y qué aprendieron. Muéstreme el registro.',ev:'Procedimiento de incidentes; registro del último año con clasificación, causa raíz, tiempos y lecciones aprendidas.',al:'«No hemos tenido incidentes» (muy improbable: detección débil); incidentes sin análisis de causa; la misma falla se repite; sin criterios de clasificación.'},
  {ref:['A.5.28'],sug:true,q:'Si hubiera que investigar un incidente, ¿cómo preservan la evidencia (registros, imágenes de disco)? ¿Quién la custodia?',ev:'Procedimiento; ejemplo de custodia.',al:'Se reinstala el equipo antes de preservar evidencia.'},
  {ref:['A.8.16'],q:'¿Qué monitorean (servidores, red, aplicaciones, accesos)? ¿Quién revisa las alertas y qué ocurre fuera de horario?',ev:'Panel de monitoreo EN VIVO; ejemplos de alertas, tickets generados y tiempos de respuesta.',al:'Alertas que nadie atiende; monitoreo solo en horario laboral con SLA 24/7 comprometido a clientes.'},
  {ref:['A.8.14'],sug:true,q:'¿Qué sistemas críticos tienen redundancia (servidores, enlaces, energía)? ¿Probaron la conmutación?',ev:'Arquitectura y prueba de failover.',al:'Un único punto de falla en un servicio comprometido con SLA alto.'},
  {ref:['A.8.32','A.8.9'],sug:true,q:'¿Cómo gestionan los cambios en producción (ventanas, aprobación, pruebas, reversión)? Elijamos 3 cambios y muéstreme su expediente.',ev:'Expedientes de cambio completos.',al:'Cambios directos sin registro; cambios de emergencia sin revisión posterior.'},
  {ref:['A.8.6'],sug:true,q:'¿Cómo monitorean la capacidad (almacenamiento, procesamiento, ancho de banda) y planifican el crecimiento?',ev:'Informes de capacidad.',al:'Se reacciona solo cuando el disco se llena.'},
  {ref:['A.5.9'],sug:true,q:'Muéstreme el inventario de activos. ¿Quién es el dueño de cada activo y cuándo se actualizó? (Pruebe en las dos direcciones: 3 equipos reales → inventario; 3 del inventario → existen.)',ev:'Inventario actualizado con propietario y clasificación.',al:'Inventario desactualizado o sin dueños.'},
  {ref:['A.5.37'],sug:true,q:'¿Existen procedimientos operativos documentados para tareas críticas (respaldo, altas y bajas, despliegues) y están al alcance de quien los usa?',ev:'2 procedimientos y evidencia de que se siguen.',al:'Todo está en la cabeza de una persona.'},
  {ref:['A.5.19','A.5.22','A.5.23'],sug:true,q:'¿Qué proveedores críticos usan (nube, hosting, conectividad)? ¿Cómo revisan su desempeño y su seguridad (certificaciones, informes, SLA)?',ev:'Contratos, SLA, informes de desempeño, certificados del proveedor (ej. ISO 27001, SOC 2).',al:'Proveedor crítico sin contrato, sin revisión desde la contratación; responsabilidades en la nube no definidas.'}
 ]},

/* ===== APLICACIÓN ===== */
'use strict';
const KEY='ga27001-sgjm-v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');

/* ---------- Estado persistente ---------- */
let storageOK=true;
function defaults(){return {resp:{},hall:[],prep:{},gprep:{},est:{},cnt:0,aj:{todos:false},informe:{conclusion:''},ultimoRespaldo:null,cambios:0};}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(defaults(),o);}}
  catch(e){storageOK=false;}
  return defaults();
}
let S=load();
let saveT=null;
function guardarYa(){
  clearTimeout(saveT);saveT=null;
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}
  avisoStorage();
}
function save(){
  S.cambios=(S.cambios||0)+1;
  clearTimeout(saveT);
  saveT=setTimeout(guardarYa,120);
}
/* Si la página se cierra o se oculta, se guarda de inmediato (evita perder lo último escrito) */
window.addEventListener('pagehide',()=>{if(saveT)guardarYa();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)guardarYa();});
function avisoStorage(){const el=$('#aviso-storage');if(el)el.classList.toggle('hide',storageOK);}

/* ---------- Índices de la norma ---------- */
const REFS={};
CLAUSULAS.forEach(c=>REFS[c[0]]={id:c[0],t:c[1],s:c[2],e:c[3],k:'cl'});
CONTROLES.forEach(c=>REFS[c[0]]={id:c[0],t:c[1],s:c[2],e:c[3],k:'ct',tema:c[0].split('.')[1]});
function expand(tokens){
  const out=new Set();
  tokens.forEach(t=>{
    if(t==='A.*'){CONTROLES.forEach(c=>out.add(c[0]));return;}
    if(t.endsWith('.*')){const p=t.slice(0,-1);CLAUSULAS.forEach(c=>{if(c[0].startsWith(p))out.add(c[0]);});return;}
    if(t.startsWith('A.')&&t.includes('-')){
      const [a,b]=t.split('-');const ia=CONTROLES.findIndex(c=>c[0]===a),ib=CONTROLES.findIndex(c=>c[0]===b);
      for(let i=ia;i<=ib;i++)out.add(CONTROLES[i][0]);return;
    }
    out.add(t);
  });
  return out;
}
const SES={};
SESIONES.forEach(s=>{SES[s.id]=s;s.cubreSet=expand(s.cubre);s.soa=s.cubre.includes('A.*');});
const TRANS_GUIAS=['planificacion','sig','ventas','marcas','tecnologia','desarrollo','servicios_ti','legal','revision'];
const CHECK_GUIAS=['apertura','equipo','cierre'];
const esCheck=s=>CHECK_GUIAS.includes(s.guia);
const esMia=s=>s.ads.includes(YO);

/* ---------- Preguntas por sesión ---------- */
const QS={};
function buildQs(){
  SESIONES.forEach(ses=>{
    const g=GUIAS[ses.guia];if(!g){QS[ses.id]=[];return;}
    const out=[];
    (g.preguntas||[]).forEach((p,i)=>out.push({id:ses.id+'.'+(i+1),ses:ses.id,ref:p.ref||[],q:p.q,ev:p.ev||'',al:p.al||'',sug:!!p.sug,k:'g'}));
    if(ses.guia==='soa')CONTROLES.forEach(c=>out.push({id:ses.id+'.'+c[0],ses:ses.id,ref:[c[0]],q:c[0]+' · '+c[1]+' — ¿Aplica según la SoA? Si aplica: ¿cómo está implementado y qué evidencia lo demuestra? Si se excluyó: ¿cuál es la justificación y sigue siendo válida?',ev:c[3],al:'',sug:false,k:'c',ctrl:c}));
    if(TRANS_GUIAS.includes(ses.guia))TRANSVERSALES.forEach((p,i)=>out.push({id:ses.id+'.T'+(i+1),ses:ses.id,ref:p.ref,q:p.q,ev:p.ev,al:p.al,sug:false,k:'t'}));
    QS[ses.id]=out;
  });
}
buildQs();
const QBYID={};Object.values(QS).forEach(a=>a.forEach(q=>QBYID[q.id]=q));
const R=id=>S.resp[id]||{s:'pendiente',n:'',e:''};
function setR(id,patch){S.resp[id]=Object.assign({s:'pendiente',n:'',e:''},S.resp[id],patch);save();}

function prog(ses){
  const qs=QS[ses.id].filter(q=>q.k!=='t');
  const hechas=qs.filter(q=>R(q.id).s!=='pendiente').length;
  return {total:qs.length,hechas,pct:qs.length?Math.round(100*hechas/qs.length):0};
}
function contar(ses){
  const c={};Object.keys(TIPOS).forEach(k=>c[k]=0);
  QS[ses.id].forEach(q=>c[R(q.id).s]++);return c;
}

/* ---------- Cobertura ---------- */
const PESO={ncmayor:7,ncmenor:6,obs:5,om:4,seguimiento:3,conforme:2,na:1,pendiente:0};
function cobertura(){
  const m={};
  Object.keys(REFS).forEach(id=>m[id]={id,asig:[],soloSoA:false,qs:[],peor:'pendiente',verif:0});
  SESIONES.forEach(s=>{
    s.cubreSet.forEach(id=>{if(!m[id])return;if(s.soa)m[id].soloSoA=true;else if(!m[id].asig.includes(s.id))m[id].asig.push(s.id);});
  });
  SESIONES.forEach(ses=>{
    if(esCheck(ses))return;
    QS[ses.id].forEach(q=>q.ref.forEach(id=>{
      if(!m[id])return;
      m[id].qs.push(q);
      const st=R(q.id).s;
      if(st!=='pendiente'){
        if(['conforme','obs','om','ncmenor','ncmayor'].includes(st))m[id].verif++;
        if(PESO[st]>PESO[m[id].peor])m[id].peor=st;
      }
    }));
  });
  return m;
}

/* ---------- Utilidades de presentación ---------- */
function chipRef(id){const r=REFS[id];return '<button class="ref" data-a="ref" data-id="'+esc(id)+'" title="'+esc(r?r.t:'')+'">'+esc(id)+'</button>';}
function refsHTML(ids){return ids.length?ids.map(chipRef).join(''):'';}
function badge(st){const t=TIPOS[st];return '<span class="badge '+t.c+'">'+t.n+'</span>';}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function diasHasta(iso){const [y,m,d]=iso.split('-').map(Number);const a=new Date(y,m-1,d);const h=new Date();h.setHours(0,0,0,0);return Math.round((a-h)/86400000);}
function hoyISO(){return ymd(new Date());}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
const csvCell=v=>'"'+String(v==null?'':v).replace(/"/g,'""').replace(/\r?\n/g,' ')+'"';

/* ---------- Vista: Plan ---------- */
function vPlan(){
  const mis=SESIONES.filter(s=>S.aj.todos||esMia(s));
  const inicio=DIAS[4],hoy=hoyISO();
  const d0=diasHasta(inicio);
  let hero;
  if(d0>0)hero='<h1>Faltan '+d0+' día'+(d0===1?'':'s')+' para el inicio</h1><p>La auditoría empieza el <b>miércoles 4 de noviembre, 10:00</b> con la Reunión de Apertura. Hoy es el día de preparar: abajo está su lista.</p>';
  else if(Object.values(DIAS).includes(hoy))hero='<h1>Hoy es día de auditoría</h1><p>Abra su siguiente sesión y siga la pestaña «Preguntar».</p>';
  else hero='<h1>Guía de auditoría ISO 27001:2022</h1><p>Seguimiento del plan de auditoría.</p>';
  const sigId=(mis.find(s=>!S.est[s.id]&&DIAS[s.dia]>=hoy)||mis.find(s=>!S.est[s.id])||{}).id;
  const todosCheck=PREP_GENERAL.map((t,i)=>'<label class="chk"><input type="checkbox" data-a="gprep" data-i="'+i+'" '+(S.gprep[i]?'checked':'')+'><span>'+esc(t)+'</span></label>').join('');
  const hechasPrep=PREP_GENERAL.filter((t,i)=>S.gprep[i]).length;
  let h='<div class="wrap">';

const BTN_ORDEN=['conforme','obs','om','ncmenor','ncmayor','seguimiento','na'];
const BTN_TXT={conforme:'Conforme',obs:'Observación',om:'Mejora',ncmenor:'NC menor',ncmayor:'NC mayor',seguimiento:'Seguimiento',na:'N/A'};
function hallDeQ(qid){return S.hall.find(h=>h.qid===qid);}
function cardQ(q,opt){
  opt=opt||{};const r=R(q.id);const ses=SES[q.ses];const chk=esCheck(ses);
  let h='<article class="q s-'+r.s+'" id="q-'+esc(q.id)+'" data-id="'+esc(q.id)+'">';
  h+='<div>'+refsHTML(q.ref)+(q.sug?'<span class="badge b-sug" title="No figura en el cronograma; lo agregué yo por riesgo">sugerido</span>':'')+(q.k==='t'?'<span class="badge t-na">transversal</span>':'')+(opt.mostrarSes?'<a class="badge t-om" href="#/sesion/'+esc(ses.id)+'">'+esc(ses.nombre)+'</a>':'')+'</div>';
  h+='<p class="q-text">'+esc(q.q)+'</p>';
  if(q.ev)h+='<p class="q-ev"><b>'+(q.k==='c'?'Evidencia típica':'Pida ver')+':</b> '+esc(q.ev)+'</p>';
  if(q.k==='c'){
    const prev=evidenciaPrevia(q);
    if(prev.length)h+='<p class="small"><span class="badge t-ok">Ya revisado esta semana</span> '+prev.map(p=>esc(p.ses.nombre)+' ('+TIPOS[R(p.q.id).s].n+')').join('; ')+'</p>';
    h+='<p class="small mut">'+esc(q.ctrl[2])+'</p>';
  }
  if(q.al)h+='<details class="q-al"><summary>Señales de alerta</summary><p>'+esc(q.al)+'</p></details>';
  if(chk){
    h+='<div class="stbtns"><button class="t-ok" aria-pressed="'+(r.s==='conforme')+'" data-a="st" data-id="'+esc(q.id)+'" data-s="conforme">'+(r.s==='conforme'?'✓ Hecho':'Marcar como hecho')+'</button></div>';
  }else{
    h+='<div class="stbtns" role="group" aria-label="Resultado">'+BTN_ORDEN.map(s=>'<button class="'+TIPOS[s].c+'" aria-pressed="'+(r.s===s)+'" data-a="st" data-id="'+esc(q.id)+'" data-s="'+s+'">'+BTN_TXT[s]+'</button>').join('')+'</div>';
  }
  const abierto=(r.n||r.e||(r.s!=='pendiente'&&!chk));
  h+='<details class="notas" '+(abierto?'open':'')+'><summary>Notas y evidencia</summary>';
  h+='<textarea data-f="n" data-id="'+esc(q.id)+'" placeholder="Qué respondió / qué observé (hechos, sin adjetivos)">'+esc(r.n)+'</textarea>';
  if(!chk){
    h+='<input type="text" data-f="e" data-id="'+esc(q.id)+'" placeholder="Evidencia vista: documento, fecha, muestra, quién la mostró" value="'+esc(r.e)+'">';
    const hh=hallDeQ(q.id);
    if(hh)h+='<a class="btn sm" href="#/hallazgo/'+hh.id+'">Ver hallazgo '+hh.id+'</a>';
    else if(['obs','om','ncmenor','ncmayor','seguimiento'].includes(r.s))h+='<button class="sm primary" data-a="mkhall" data-id="'+esc(q.id)+'">Convertir en hallazgo</button>';
  }
  h+='</details></article>';
  return h;
}
function evidenciaPrevia(q){
  const out=[];
  SESIONES.forEach(s=>{
    if(s.id===q.ses||esCheck(s))return;
    QS[s.id].forEach(x=>{if(x.k!=='c'&&x.ref.includes(q.ref[0])&&R(x.id).s!=='pendiente')out.push({ses:s,q:x});});
  });
  return out;
}
function refreshQ(id){
  const q=QBYID[id];const el=document.getElementById('q-'+id);if(!q||!el)return;
  const mostrar=!!el.querySelector('a.badge');
  const tmp=document.createElement('div');tmp.innerHTML=cardQ(q,{mostrarSes:mostrar});
  const nuevo=tmp.firstElementChild;
  nuevo.querySelector('details.notas').open=el.querySelector('details.notas').open||nuevo.querySelector('details.notas').open;
  el.replaceWith(nuevo);
  const hd=$('#prog-ses');if(hd)hd.innerHTML=progHTML(SES[q.ses]);
}
function progHTML(ses){
  const p=prog(ses);const c=contar(ses);
  const hall=['ncmayor','ncmenor','obs','om'].filter(k=>c[k]).map(k=>'<span class="badge '+TIPOS[k].c+'">'+TIPOS[k].abbr+' '+c[k]+'</span>').join('');
  return '<div class="row"><div class="bar sp"><i style="width:'+p.pct+'%"></i></div><span class="small mut">'+p.hechas+'/'+p.total+' ('+p.pct+'%)</span></div><div style="margin-top:6px">'+hall+'</div>';
}

function avisosSesion(s){

function sPreparar(s,g){

function sPreguntar(s,g){
  if(s.guia==='pendientes')return sPendientes();

  }

const HTIPOS={ncmayor:'No conformidad mayor',ncmenor:'No conformidad menor',obs:'Observación',om:'Oportunidad de mejora',fortaleza:'Fortaleza / buena práctica'};
const HCLASE={ncmayor:'t-ncM',ncmenor:'t-ncm',obs:'t-obs',om:'t-om',fortaleza:'t-ok'};
const badgeH=t=>'<span class="badge '+(HCLASE[t]||'t-na')+'">'+esc(HTIPOS[t]||t)+'</span>';
function reqTexto(refs){
  return refs.split(/[,;\s]+/).filter(Boolean).map(id=>{const r=REFS[id];return r?('ISO/IEC 27001:2022, '+(r.k==='ct'?'control ':'cláusula ')+id+' – '+r.t):id;}).join('\n');
}
function hallTexto(x){
  let t='Requisito: '+(x.req||reqTexto(x.ref||'')||'[falta]')+'\nEvidencia objetiva: '+(x.evid||'[falta]')+'\nHallazgo: '+(x.cond||'[falta]');
  if(x.efecto)t+='\nConsecuencia / riesgo: '+x.efecto;
  if(x.causa)t+='\nCausa (si se determinó): '+x.causa;
  return t;
}
function calidadH(x){
  const f=[];
  if(!(x.ref||x.req))f.push('Cite el requisito (cláusula o control)');
  if(!x.evid||x.evid.length<15)f.push('Describa la evidencia objetiva: documento, fecha, muestra, quién la mostró');
  if(!x.cond||x.cond.length<20)f.push('Redacte el hallazgo con hechos');
  if(x.cond&&/\b(mal|malo|deficiente|pésimo|terrible|siempre|nunca|nadie)\b/i.test(x.cond))f.push('Evite adjetivos o absolutos («mal», «nadie», «nunca»): use cifras y hechos');
  if(!x.aud)f.push('Indique el auditado / responsable del proceso');
  if(!x.validado)f.push('Valide los hechos con el auditado');
  return f;
}
function nuevoH(opts){
  opts=opts||{};S.cnt++;const id='H-'+String(S.cnt).padStart(3,'0');
  const q=opts.qid?QBYID[opts.qid]:null;const r=q?R(q.id):null;
  const tipoMap={ncmayor:'ncmayor',ncmenor:'ncmenor',obs:'obs',om:'om',seguimiento:'obs'};
  const ses=q?SES[q.ses]:null;
  const x={id,ses:ses?ses.id:(opts.ses||''),qid:q?q.id:'',tipo:r&&tipoMap[r.s]?tipoMap[r.s]:'obs',ref:q?q.ref.filter(z=>REFS[z]).join(', '):'',req:'',evid:r?r.e:'',cond:r?r.n:'',efecto:'',causa:'',aud:ses?ses.aud.join(' / '):'',validado:false,creado:new Date().toISOString()};
  S.hall.push(x);save();return x;
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(el.tagName==='INPUT'&&el.type==='file')return;
  if(a==='cerrar'){if(e.target.closest('div[role=dialog]')&&el.classList.contains('modal')&&e.target!==el)return;$('.modal')?.remove();return;}
  if(a==='ref'){e.preventDefault();const m=document.createElement('div');m.innerHTML=modalRef(el.dataset.id);document.body.appendChild(m.firstElementChild);return;}
  if(a==='st'){const id=el.dataset.id;const act=R(id).s;setR(id,{s:act===el.dataset.s?'pendiente':el.dataset.s});refreshQ(id);return;}
  if(a==='tab'){tabSes=el.dataset.t;render();window.scrollTo(0,0);return;}
  if(a==='fq'){filtroQ=el.dataset.f;render();return;}
  if(a==='fs'){filtroSoA=el.dataset.f;render();return;}
  if(a==='fh'){filtroH=el.dataset.f;render();return;}
  if(a==='fc'){filtroCob=el.dataset.f;render();return;}
  if(a==='tb'){tabBib=el.dataset.t;busqueda='';render();return;}
  if(a==='todos'){S.aj.todos=!S.aj.todos;save();render();return;}
  if(a==='hecha'){const id=el.dataset.id;S.est[id]=!S.est[id];save();render();return;}
  if(a==='mkhall'){const x=nuevoH({qid:el.dataset.id});location.hash='#/hallazgo/'+x.id;return;}
  if(a==='nuevoh'){const x=nuevoH({ses:el.dataset.ses||''});location.hash='#/hallazgo/'+x.id;return;}
  if(a==='delh'){if(confirm('¿Eliminar este hallazgo?')){S.hall=S.hall.filter(z=>z.id!==el.dataset.id);save();location.hash='#/hallazgos';}return;}
  if(a==='print'){window.print();return;}
  if(a==='copiarinf'){const t=informeTexto();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Informe copiado')).catch(()=>{const p=$('#inf-prev');const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Seleccionado: use Copiar');});return;}
  if(a==='docinf'){descargar('Informe-Auditoria-ISO27001.doc','<html><head><meta charset="utf-8"></head><body><pre style="font-family:Calibri,Arial;font-size:11pt;white-space:pre-wrap">'+esc(informeTexto())+'</pre></body></html>','application/msword');return;}
  if(a==='backup'){S.ultimoRespaldo=new Date().toISOString();save();descargar('respaldo-auditoria-'+hoyISO()+'.json',JSON.stringify(S,null,1),'application/json');toast('Respaldo descargado');render();return;}
  if(a==='csvr'){
    const rows=[['Sesión','Id','Requisito(s)','Pregunta','Resultado','Notas','Evidencia vista']];
    SESIONES.forEach(s=>QS[s.id].forEach(q=>{const r=R(q.id);if(r.s!=='pendiente'||r.n||r.e)rows.push([s.nombre,q.id,q.ref.join(' '),q.q,TIPOS[r.s].n,r.n,r.e]);}));
    descargar('respuestas-auditoria.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');return;}
  if(a==='csvh'){
    const rows=[['Id','Clasificación','Sesión','Auditado','Requisito','Evidencia objetiva','Hallazgo','Consecuencia','Causa','Validado']];
    S.hall.forEach(x=>rows.push([x.id,HTIPOS[x.tipo],SES[x.ses]?SES[x.ses].nombre:'',x.aud,x.req||reqTexto(x.ref||''),x.evid,x.cond,x.efecto,x.causa,x.validado?'Sí':'No']));
    descargar('hallazgos-auditoria.csv','﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');return;}
  if(a==='tema'){const t=el.dataset.t;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(KEY+'-tema',t);}catch(x){}return;}
  if(a==='reset'){if(confirm('Se borrarán TODAS las respuestas y hallazgos de este dispositivo. ¿Continuar?')){S=defaults();save();render();toast('Datos borrados');}return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='gprep'){S.gprep[t.dataset.i]=t.checked;save();render();return;}
  if(t.dataset.a==='prep'){S.prep[t.dataset.k]=t.checked;save();return;}
  if(t.dataset.a==='restore'){
    const f=t.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||typeof o!=='object'||!o.resp)throw 0;S=Object.assign(defaults(),o);save();render();toast('Respaldo restaurado');}catch(x){alert('El archivo no es un respaldo válido.');}};
    rd.readAsText(f);return;}
  if(t.dataset.hf){const x=S.hall.find(z=>z.id===ruta().a);if(!x)return;const k=t.dataset.hf;x[k]=t.type==='checkbox'?t.checked:t.value;save();refreshH(x.id);}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f==='n'||t.dataset.f==='e'){setR(t.dataset.id,{[t.dataset.f]:t.value});return;}
  if(t.dataset.f==='concl'){S.informe.conclusion=t.value;save();const p=$('#inf-prev');if(p)p.textContent=informeTexto();return;}
  if(t.dataset.hf&&t.type!=='checkbox'){const x=S.hall.find(z=>z.id===ruta().a);if(!x)return;x[t.dataset.hf]=t.value;save();refreshH(x.id);return;}
  if(t.id==='busca'){busqueda=t.value;const pos=t.selectionStart;render();const n=$('#busca');if(n){n.focus();n.setSelectionRange(pos,pos);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('.modal')?.remove();});

/* ---------- Arranque ---------- */
(function(){
  try{const t=localStorage.getItem(KEY+'-tema');if(t&&t!=='auto')document.documentElement.setAttribute('data-theme',t);}catch(e){}
  if(!location.hash)location.hash='#/plan';
  render();
})();

</script>
</body>
</html>
